<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
    <link rel="stylesheet" href="listadoU.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
<div class="menu-btn sidebar-btn" id="sidebar-btn">
    <i class="bx bx-menu"></i>
    <i class="bx bx-x"></i>
</div>

<div class="sidebar" id="sidebar">
    <div class="header">
        <div class="menu-btn" id="menu-btn">
            <i class='bx bx-chevron-left'></i>
        </div>
    </div>
    <div class="brand">
        <img src="bostraap/icons/logo.jpeg" alt="logo">
        <span>D'juan Carlos Peluqueria</span>
    </div>
    <div class="menu_c">
        <ul class="menu">
            <li class="menu-item menu-item-static">
                <a href="Administrador.html" class="menu-link">
                    <i class='bx bx-home'></i>
                    <span>Perfil</span>
                </a>
            </li>
            <li class="menu-item menu-item-dropdown active">
                <a href="#" class="menu-link">
                    <i class='bx bx-shopping-bag'></i>
                    <span>Usuarios</span>
                    <i class='bx bx-chevron-down'></i>
                </a>
                <ul class="sub-menu">
                    <li><a class="sub-menu-link active" href="listadoU.html">Listado de usuarios</a></li>
                    <li><a class="sub-menu-link" href="crearU.html">Crear un usuario</a></li>
                </ul>
            </li>
        </ul>
    </div>
    <div class="footer">
        <div class="user">
            <div class="user-img">
                <img src="bostraap/icons/Starter pfp.jpg" alt="user">
            </div>
            <div class="user-info">
                <span class="name" id="user-cargo">Cliente</span>
                <span class="email" id="user-email">cargando...</span>
            </div>
            <div class="user-icon">
                <a href="/logout"><i class='bx bx-exit'></i></a>
            </div>
        </div>
    </div>
</div>

<main>
    <div class="dashboard-grid">
        <div class="caja tabla-wrapper">
            <div class="tabla-container">
                <h2>Listado de Usuarios</h2>
                <div class="tabla-info">
                    <span id="info-registros">Mostrando 0 de 0 usuarios</span>
                    <span id="info-pagina">Página 1 de 1</span>
                </div>

                <table class="tabla-usuarios">
                    <thead>
                    <tr>
                        <th>Nombre Completo</th>
                        <th>Tipo Doc.</th>
                        <th>N° Documento</th>
                        <th>Género</th>
                        <th>Dirección</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Cargo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tabla-body">
                    <!-- Los datos se cargan dinámicamente con JS -->
                    </tbody>
                </table>

                <div class="paginacion" id="paginacion-container">
                    <!-- Botones de paginación generados por JS -->
                </div>
            </div>
        </div>
    </div>
</main>

<script src="listadoU.js"></script>
</body>

</html>
